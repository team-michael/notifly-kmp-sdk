name: Prerelease

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version without the v prefix
        required: true
        default: 0.1.0-alpha.1

permissions:
  contents: write
  id-token: write

concurrency:
  group: notifly-kmp-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 60
    environment: release
    env:
      VERSION: ${{ inputs.version }}
      COCOAPODS_TRUNK_TOKEN: ${{ secrets.COCOAPODS_TRUNK_TOKEN }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Upgrade npm
        run: npm install -g npm@11.5.1

      - name: Validate version
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-alpha\.[0-9]+$ ]]

      - name: Detect existing release state
        id: release-state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$VERSION"
          if git rev-parse "$tag" >/dev/null 2>&1; then
            tag_commit="$(git rev-list -n 1 "$tag")"
            git merge-base --is-ancestor "$tag_commit" origin/main
            git checkout --detach "$tag"
            echo "tag_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "tag_exists=false" >> "$GITHUB_OUTPUT"
          fi

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "github_release_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "github_release_exists=false" >> "$GITHUB_OUTPUT"
          fi

          if npm view "notifly-kmp-sdk" name >/dev/null 2>&1; then
            echo "npm_package_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "npm_package_exists=false" >> "$GITHUB_OUTPUT"
          fi

          if npm view "notifly-kmp-sdk@$VERSION" version >/dev/null 2>&1; then
            echo "npm_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "npm_exists=false" >> "$GITHUB_OUTPUT"
          fi

          if pod trunk info NotiflyKMP 2>/dev/null | scripts/cocoapods-version-exists.rb "$VERSION"; then
            echo "cocoapods_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "cocoapods_exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify npm trusted publishing bootstrap
        if: steps.release-state.outputs.npm_package_exists != 'true'
        run: |
          echo "::error::Publish notifly-kmp-sdk once, then configure this workflow as its npm trusted publisher."
          exit 1

      - name: Test and build
        run: |
          ./gradlew \
            :kmp:jvmTest \
            :kmp:jsNodeTest \
            :kmp:iosSimulatorArm64Test \
            :kmp:publishToMavenLocal \
            :kmp:packJsPackage \
            :kmp:assembleNotiflyKMPReleaseXCFramework \
            --no-daemon

      - name: Smoke-test artifacts
        run: |
          scripts/smoke-maven-local.sh
          node scripts/smoke-js-package.mjs "kmp/build/packages/notifly-kmp-sdk-$VERSION.tgz"
          scripts/smoke-apple-artifacts.sh

      - name: Publish npm prerelease
        if: steps.release-state.outputs.npm_exists != 'true'
        run: npm publish "kmp/build/packages/notifly-kmp-sdk-$VERSION.tgz" --provenance --access public --tag next

      - name: Prepare release archive and manifests
        id: apple
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_dir="$PWD/kmp/build/release/$VERSION"
          archive="$release_dir/NotiflyKMP.xcframework.zip"
          mkdir -p "$release_dir"

          if [[ "${{ steps.release-state.outputs.github_release_exists }}" == "true" ]]; then
            gh release download "v$VERSION" \
              --pattern "NotiflyKMP.xcframework.zip" \
              --dir "$release_dir" \
              --clobber
            checksum="$(swift package compute-checksum "$archive")"
          else
            output="$(SKIP_BUILD=true scripts/prepare_release.sh "$VERSION")"
            archive="$(printf '%s\n' "$output" | sed -n '1p')"
            checksum="$(printf '%s\n' "$output" | sed -n '2p')"
          fi

          if [[ "${{ steps.release-state.outputs.tag_exists }}" == "true" ]]; then
            grep -F "checksum: \"$checksum\"" Package.swift >/dev/null
            grep -F ":sha256 => \"$checksum\"" NotiflyKMP.podspec >/dev/null
          else
            scripts/update_release_manifests.rb "$VERSION" "$checksum"
          fi

          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          echo "checksum=$checksum" >> "$GITHUB_OUTPUT"

      - name: Commit versioned manifests
        if: steps.release-state.outputs.tag_exists != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Package.swift NotiflyKMP.podspec
          if ! git diff --cached --quiet; then
            git commit -m "chore: prepare v$VERSION"
            git push origin HEAD:main
          fi

      - name: Create GitHub release
        if: steps.release-state.outputs.github_release_exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" \
            "${{ steps.apple.outputs.archive }}" \
            "kmp/build/release/$VERSION/checksum.txt" \
            --target "$(git rev-parse HEAD)" \
            --prerelease \
            --generate-notes \
            --title "v$VERSION"

      - name: Publish CocoaPods prerelease
        if: steps.release-state.outputs.cocoapods_exists != 'true'
        run: pod trunk push NotiflyKMP.podspec --allow-warnings

      - name: Trigger and verify JitPack
        run: |
          pom_url="https://jitpack.io/com/github/team-michael/notifly-kmp-sdk/kmp/v$VERSION/kmp-v$VERSION.pom"
          for attempt in {1..30}; do
            if curl --fail --location --silent --show-error "$pom_url" --output /tmp/notifly-kmp.pom; then
              exit 0
            fi
            sleep 20
          done
          exit 1
